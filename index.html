        const allQuestionsData = [
            // 2025
            // Grammar
            {id: 1, year: 2025, category: "Grammar", question: "We saw _______ children in the park.", options: ["any", "some", "a", "much"], answer: "some", explanation: "'Some' ប្រើជាមួយនាមរាប់បានពហុវចនៈ (children) ក្នុងប្រយោគស្រប។"},

            // Vocabulary
            {id: 6, year: 2025, category: "Vocabulary", question: "According to the weather _______, there will be rain tomorrow.", options: ["programme", "survey", "forecast", "information"], answer: "forecast", explanation: "'Weather forecast' (ការព្យាករណ៍អាកាសធាតុ)។"},
            {id: 7, year: 2025, category: "Vocabulary", question: "How much do they _______ for cleaning your room?", options: ["cost", "need", "demand", "charge"], answer: "charge", explanation: "'Charge' (គិតថ្លៃសេវាកម្ម)។"},
            {id: 8, year: 2025, category: "Vocabulary", question: "The restaurant services are bad, so we should write a _______ to the manager.", options: ["writing", "complaint", "message", "essay"], answer: "complaint", explanation: "'Write a complaint' (សរសេរពាក្យបណ្ដឹង)។"},
            {id: 9, year: 2025, category: "Vocabulary", question: "Most people in the town _______ the idea of clean and green city.", options: ["support", "agree", "believe", "approve"], answer: "support", explanation: "'Support the idea' (គាំទ្រគំនិត)។"},
            {id: 10, year: 2025, category: "Vocabulary", question: "Please confirm your reservation in _______.", options: ["writing", "words", "letter", "paper"], answer: "writing", explanation: "'In writing' (ជាលាយលក្ខណ៍អក្សរ)។"},
            // 2024
            // Grammar
            {id: 11, year: 2024, category: "Grammar", question: "You broke the glass, _______?", options: ["haven't you", "didn't you", "have you", "did you"], answer: "didn't you", explanation: "Question Tag: Past Simple (broke) -> didn't you។"},
            {id: 12, year: 2024, category: "Grammar", question: "My father is quite fat now, but he _______ be fat years ago.", options: ["didn't use to", "doesn't use", "didn't use", "use not"], answer: "didn't use to", explanation: "'Didn't use to' (មិនធ្លាប់) បង្ហាញពីទម្លាប់អតីតកាល។"},
            {id: 13, year: 2024, category: "Grammar", question: "A lot of accidents _______ by drunk drivers.", options: ["are caused", "are cause", "have cause", "have caused"], answer: "are caused", explanation: "Passive Voice (Present Simple): Accidents are caused by...។"},
            {id: 14, year: 2024, category: "Grammar", question: "All flights to Siem Reap _______ cancelled because of the bad weather.", options: ["have been", "have being", "are been", "have"], answer: "have been", explanation: "Passive Voice (Present Perfect): Flights have been cancelled. (លទ្ធផលបច្ចុប្បន្ន)។"},
            {id: 15, year: 2024, category: "Grammar", question: "If he spoke louder, I _______ understand much better.", options: ["would be able", "would be able to", "could", "may"], answer: "would be able to", explanation: "Second Conditional: If + Past Simple, ... would + V1. 'Would be able to' + understand។"},
            // Vocabulary
            {id: 16, year: 2024, category: "Vocabulary", question: "Did you _______ that book from the school library?", options: ["beg", "ask", "lend", "borrow"], answer: "borrow", explanation: "'Borrow' (ខ្ចីពីគេ)។"},
            {id: 17, year: 2024, category: "Vocabulary", question: "My driving license _______ at the end of this month.", options: ["retires", "expires", "passes out", "concludes"], answer: "expires", explanation: "'Expire' (ផុតកំណត់)។"},
            {id: 18, year: 2024, category: "Vocabulary", question: "I was very _______ for all the advice she gave me.", options: ["depress", "glad", "grateful", "please"], answer: "grateful", explanation: "'Grateful for' (ដឹងគុណចំពោះ)។"},
            {id: 19, year: 2024, category: "Vocabulary", question: "After a few hours of discussion, we finally reached a _______.", options: ["compromise", "promise", "situation", "solution"], answer: "compromise", explanation: "'Reach a compromise' (ឈានដល់ការសម្របសម្រួល)។"},
            {id: 20, year: 2024, category: "Vocabulary", question: "Many people believe that violent computer games can have a harmful _______ on children.", options: ["affect", "effect", "damage", "involvement"], answer: "effect", explanation: "'Harmful effect' (ឥទ្ធិពលអាក្រក់)។"},
            // 2023
            // Grammar
            {id: 21, year: 2023, category: "Grammar", question: "Parents _______ a lot of patience with their children.", options: ["are having", "have", "has", "having"], answer: "have", explanation: "Parents (Plural) + have។ នេះជាការពិតទូទៅ។"},
            {id: 22, year: 2023, category: "Grammar", question: "The driver _______ in the crash.", options: ["was injured", "injured", "injuring", "he injured"], answer: "was injured", explanation: "Passive Voice: The driver was injured (អ្នកបើកបរត្រូវបានរបួស)។"},
            {id: 23, year: 2023, category: "Grammar", question: "Sophal plays tennis well, but he play football _______.", options: ["very good", "much better", "too well", "best"], answer: "much better", explanation: "Comparative: 'Better' (ល្អជាង)។ 'Much' បញ្ជាក់កម្រិត។"},
            {id: 24, year: 2023, category: "Grammar", question: "All the trees in the park _______ recently.", options: ["have been planted", "have being planted", "are planting", "are being planted"], answer: "have been planted", explanation: "'Recently' បញ្ជាក់ពី Present Perfect Passive (have been planted)។"},
            {id: 25, year: 2023, category: "Grammar", question: "If pictures weren't so expensive, I _______ many more.", options: ["would buy", "will buy", "bought", "may buy"], answer: "would buy", explanation: "Second Conditional: If + Past Simple, ... would + V1។"},
            // Vocabulary
            {id: 26, year: 2023, category: "Vocabulary", question: "Many areas are very dry, the villagers spent a lot of time to get water from the _______.", options: ["hill", "forest", "pond", "flood"], answer: "pond", explanation: "'Pond' (ស្រះទឹក)។"},
            {id: 27, year: 2023, category: "Vocabulary", question: "Why don't you become a teacher? There's a great _______ of them at the moment.", options: ["shortage", "want", "requirement", "need"], answer: "shortage", explanation: "'Shortage of' (កង្វះខាត)។"},
            {id: 28, year: 2023, category: "Vocabulary", question: "When my father died, I had no _______ but to leave schools and get a job.", options: ["possibility", "choice", "hope", "chance"], answer: "choice", explanation: "Idiom: 'Have no choice but to...' (គ្មានជម្រើសអ្វីក្រៅពី...)។"},
            {id: 29, year: 2023, category: "Vocabulary", question: "Today's volleyball match has been _______ because of bad weather. They will play next Thursday instead.", options: ["postponed", "cancelled", "decided", "put away"], answer: "postponed", explanation: "'Postponed' (ពន្យារពេល) ព្រោះលេងថ្ងៃក្រោយ។"},
            {id: 30, year: 2023, category: "Vocabulary", question: "He was given the _______ to study abroad.", options: ["occasion", "possibility", "advantage", "opportunity"], answer: "opportunity", explanation: "'Given the opportunity' (ត្រូវបានផ្តល់ឱកាស)។"},
            // 2022
            // Grammar
            {id: 31, year: 2022, category: "Grammar", question: "Good management _______ to the employees.", options: ["will be listened", "are listened", "listen", "listens"], answer: "listens", explanation: "Management (singular subject) + listens (singular verb)។"},
            {id: 32, year: 2022, category: "Grammar", question: "He has got a new friend _______ works in the bank.", options: ["whose", "where", "who", "which"], answer: "who", explanation: "Relative Pronoun 'Who' សម្រាប់មនុស្ស (friend)។"},
            {id: 33, year: 2022, category: "Grammar", question: "Your mother used to visit you quite often, _______?", options: ["didn't she", "doesn't she", "wouldn't she", "hadn't she"], answer: "didn't she", explanation: "'Used to' (Past Simple) -> didn't she។"},
            {id: 34, year: 2022, category: "Grammar", question: "I _______ on the bus when I dropped my wallet.", options: ["am getting", "get", "was getting", "have gotten"], answer: "was getting", explanation: "Past Continuous (was getting) សម្រាប់សកម្មភាពកំពុងបន្តក្នុងអតីតកាល។"},
            {id: 35, year: 2022, category: "Grammar", question: "More roads _______ every year.", options: ["was built", "had built", "are being built", "are building"], answer: "are being built", explanation: "Passive Voice (Present Continuous): Roads are being built (កំពុងត្រូវបានសាងសង់)។"},
            // Vocabulary
            {id: 36, year: 2022, category: "Vocabulary", question: "What are you going to do when you _______ school?", options: ["conclude", "end", "complete", "leave"], answer: "leave", explanation: "'Leave school' (ឈប់រៀន/បញ្ចប់ការសិក្សា)។"},
            {id: 37, year: 2022, category: "Vocabulary", question: "All medicines should be kept out of _______ of children.", options: ["hand", "touch", "contact", "reach"], answer: "reach", explanation: "'Out of reach' (ផុតពីដៃ)។"},
            {id: 38, year: 2022, category: "Vocabulary", question: "He _______ to get some cards for his birthday, but none arrived.", options: ["promised", "expected", "assumed", "supposed"], answer: "expected", explanation: "'Expected' (រំពឹងទុក)។"},
            {id: 39, year: 2022, category: "Vocabulary", question: "Is it possible to _______ now for the next term's classes?", options: ["participate", "join in", "enter", "enroll"], answer: "enroll", explanation: "'Enroll' (ចុះឈ្មោះចូលរៀន)។"},
            {id: 40, year: 2022, category: "Vocabulary", question: "I _______ to inform you that your grandmother died ten minutes ago.", options: ["apologise", "sorry", "pity", "regret"], answer: "regret", explanation: "'Regret to inform' (សោកស្តាយក្នុងការជម្រាបជូន)។"},
            // 2021
            // Grammar
            {id: 41, year: 2021, category: "Grammar", question: "Mr. Kimseng can't talk on phone because he _______ dinner right now.", options: ["is eating", "eats", "has eaten", "has been eating"], answer: "is eating", explanation: "'Right now' -> Present Continuous (is eating)។"},
            {id: 42, year: 2021, category: "Grammar", question: "That little girl _______ for the last two days.", options: ["hasn't eaten", "doesn't eat", "isn't eating", "has eaten"], answer: "hasn't eaten", explanation: "Present Perfect (Negative): មិនបានញ៉ាំអ្វីសោះរយៈពេល ២ ថ្ងៃហើយ។"},
            {id: 43, year: 2021, category: "Grammar", question: "Several trees fell down last night _______ the strong wind.", options: ["because", "so", "since", "because of"], answer: "because of", explanation: "'Because of' + Noun Phrase (the strong wind)។"},
            {id: 44, year: 2021, category: "Grammar", question: "I hope you _______ us when you come here.", options: ["visited", "would visit", "visiting", "will visit"], answer: "will visit", explanation: "'Hope' សម្រាប់អនាគត -> will visit។"},
            {id: 45, year: 2021, category: "Grammar", question: "If she doesn't do her homework, she _______ punished.", options: ["is", "would be", "will be", "will have"], answer: "will be", explanation: "First Conditional: If + Present, ... Future (will be + V3)។"},
            // Vocabulary
            {id: 46, year: 2021, category: "Vocabulary", question: "I'm really _______ of my child who got the first prize in art competition.", options: ["pleased", "proud", "happy", "delighted"], answer: "proud", explanation: "'Proud of' (មានមោទកភាព)។"},
            {id: 47, year: 2021, category: "Vocabulary", question: "In recent years inflation has almost doubled the _______ of living.", options: ["cost", "expense", "charge", "price"], answer: "cost", explanation: "'Cost of living' (តម្លៃនៃការរស់នៅ)។"},
            {id: 48, year: 2021, category: "Vocabulary", question: "The restaurant services are bad, so we should write a _______ to the manager.", options: ["essay", "message", "complaint", "information"], answer: "complaint", explanation: "'Complaint' (ពាក្យបណ្ដឹង)។"},
            {id: 49, year: 2021, category: "Vocabulary", question: "The plane was delayed by fog, and so I _______ my connection.", options: ["lost", "abandoned", "forgot", "missed"], answer: "missed", explanation: "'Missed connection' (ខកជើងយន្តហោះត)។"},
            {id: 50, year: 2021, category: "Vocabulary", question: "She went to the library to _______.", options: ["borrow a book", "lend a book", "let a book", "hire a book"], answer: "borrow a book", explanation: "'Borrow a book' (ខ្ចីសៀវភៅ)។"},
            // 2019
            // Grammar
            {id: 51, year: 2019, category: "Grammar", question: "Samnang works in the Post Office, _______?", options: ["is he", "isn't he", "works he", "doesn't he"], answer: "doesn't he", explanation: "Present Simple (works) -> doesn't he។"},
            {id: 52, year: 2019, category: "Grammar", question: "My father _______ in that firm from 1975 to 1989. Now he's retired.", options: ["has worked", "worked", "is working", "had worked"], answer: "worked", explanation: "Past Simple: កំឡុងពេលជាក់លាក់ក្នុងអតីតកាល ហើយចប់ហើយ។"},
            {id: 53, year: 2019, category: "Grammar", question: "Which sentence is the correct one?", options: ["I am a cold", "I've catched a cold", "I have cold", "I have caught a cold"], answer: "I have caught a cold", explanation: "'Catch a cold' -> Have caught a cold (Present Perfect)។"},
            {id: 54, year: 2019, category: "Grammar", question: "I _______ on a bench in the park when they ran past me.", options: ["was sitting", "have sat", "sat", "was sat"], answer: "was sitting", explanation: "Past Continuous (was sitting) ត្រូវរំខានដោយ Past Simple (ran)។"},
            {id: 55, year: 2019, category: "Grammar", question: "Thida _______ to the cinema if you went with her.", options: ["will go", "would go", "goes", "went"], answer: "would go", explanation: "Second Conditional: If + Past Simple (went), ... would + V1។"},
            // Vocabulary
            {id: 56, year: 2019, category: "Vocabulary", question: "At _______ time, there is always plenty of work to do on a farm.", options: ["production", "profit", "plant", "harvest"], answer: "harvest", explanation: "'Harvest time' (រដូវប្រមូលផល)។"},
            {id: 57, year: 2019, category: "Vocabulary", question: "It is against the _______ not to wear seat belt in a plane.", options: ["rule", "regulation", "law", "order"], answer: "law", explanation: "'Law' (ច្បាប់)។"},
            {id: 58, year: 2019, category: "Vocabulary", question: "Everything in the sale has been _______ to half price.", options: ["reduced", "decreased", "bargained", "lowered"], answer: "reduced", explanation: "'Reduced' (បញ្ចុះតម្លៃ)។"},
            {id: 59, year: 2019, category: "Vocabulary", question: "I _______ to inform you that your grandmother died ten minutes ago.", options: ["apologise", "sorry", "pity", "regret"], answer: "regret", explanation: "'Regret to inform' (សោកស្តាយក្នុងការជម្រាប)។"},
            {id: 60, year: 2019, category: "Vocabulary", question: "We were unable to reach an agreement because of the _______ between the two groups.", options: ["contact", "concern", "connection", "conflict"], answer: "conflict", explanation: "'Conflict' (ជម្លោះ)។"},
            // 2018
            // Grammar
            {id: 61, year: 2018, category: "Grammar", question: "We haven't got _______ money to buy a new car yet.", options: ["quite", "too much", "too many", "enough"], answer: "enough", explanation: "'Enough money' (លុយគ្រប់គ្រាន់)។"},
            {id: 62, year: 2018, category: "Grammar", question: "The person _______ my hair usually does a very good job.", options: ["who he cuts", "who cuts", "cuts", "cuts it"], answer: "who cuts", explanation: "Relative Clause: 'Who' ជាប្រធាន។"},
            {id: 63, year: 2018, category: "Grammar", question: "We _______ to the baseball game when it started to rain.", options: ["are driving", "drives", "driven", "were driving"], answer: "were driving", explanation: "Past Continuous (were driving) ត្រូវរំខានដោយ Past Simple (started)។"},
            {id: 64, year: 2018, category: "Grammar", question: "The new bridge _______ before the end of next month.", options: ["will be completed", "will complete", "is completed", "completes"], answer: "will be completed", explanation: "Future Passive: will be completed (នឹងត្រូវសាងសង់រួច)។"},
            {id: 65, year: 2018, category: "Grammar", question: "Their marriage wouldn't be so good if they _______ so well with each other.", options: ["communicated", "didn't communicate", "don't communicate", "communicate"], answer: "didn't communicate", explanation: "Mixed/Second Conditional: If clause (didn't communicate), Main clause (wouldn't be)។"},
            // Vocabulary
            {id: 66, year: 2018, category: "Vocabulary", question: "I saw a nasty _______ between two cars this morning.", options: ["damage", "danger", "accident", "happening"], answer: "accident", explanation: "'Nasty accident' (គ្រោះថ្នាក់អាក្រក់)។"},
            {id: 67, year: 2018, category: "Vocabulary", question: "All medicines should be kept out of _______ of children.", options: ["hand", "touch", "contact", "reach"], answer: "reach", explanation: "'Out of reach' (ផុតដៃក្មេង)។"},
            {id: 68, year: 2018, category: "Vocabulary", question: "Everything in the sale has been _______ to half price.", options: ["reduced", "decreased", "bargained", "lowered"], answer: "reduced", explanation: "'Reduced' (បញ្ចុះ)។"},
            {id: 69, year: 2018, category: "Vocabulary", question: "At work, Vuthy always arrives on time, he's so _______.", options: ["timeless", "punctual", "boring", "careful"], answer: "punctual", explanation: "'Punctual' (ទៀងពេលវេលា)។"},
            {id: 70, year: 2018, category: "Vocabulary", question: "It'll take you over an hour to get to the city centre in _______ hour.", options: ["rush", "busy", "run", "crowded"], answer: "rush", explanation: "'Rush hour' (ម៉ោងស្ទះចរាចរណ៍/មមាញឹក)។"},
            // 2017
            // Grammar
            {id: 71, year: 2017, category: "Grammar", question: "Girls, you _______ say those things about your teachers.", options: ["mustn't", "haven't to", "haven't", "mustn't to"], answer: "mustn't", explanation: "'Mustn't' (ហាមដាច់ខាត)។"},
            {id: 72, year: 2017, category: "Grammar", question: "Have another piece of cake. No, thanks, _______ too much.", options: ["I've ate", "I ate", "I eaten", "I've eaten"], answer: "I've eaten", explanation: "Present Perfect: I've eaten (ញ៉ាំរួចហើយ)។"},
            {id: 73, year: 2017, category: "Grammar", question: "I was going to do the washing, but the machine _______ down.", options: ["broke", "breaks", "broken", "break"], answer: "broke", explanation: "Past Simple (broke)។"},
            {id: 74, year: 2017, category: "Grammar", question: "My secretary was late. She had never _______ late before.", options: ["was", "had", "came", "been"], answer: "been", explanation: "Past Perfect: She had never been late (មិនដែលយឺតសោះពីមុន)។"},
            {id: 75, year: 2017, category: "Grammar", question: "If you give some money, I _______ to go shopping.", options: ["can", "could", "will be able", "will can"], answer: "will be able", explanation: "Future Ability: will be able to។"},
            // Vocabulary
            {id: 76, year: 2017, category: "Vocabulary", question: "Before you begin the exam paper, always read the _______ carefully.", options: ["orders", "instruction", "rules", "answers"], answer: "instruction", explanation: "'Read the instruction' (អានសេចក្តីណែនាំ)។"},
            {id: 77, year: 2017, category: "Vocabulary", question: "If you put your money in the bank, it will earn ten percent _______.", options: ["interest", "profit", "deposit", "investment"], answer: "interest", explanation: "'Interest' (ការប្រាក់)។"},
            {id: 78, year: 2017, category: "Vocabulary", question: "Most people in the town _______ the idea of Green and Clean city.", options: ["agree", "approve", "support", "believe"], answer: "support", explanation: "'Support the idea' (គាំទ្រគំនិត)។"},
            {id: 79, year: 2017, category: "Vocabulary", question: "The plane was delayed by fog, and so I _______ my connection.", options: ["lost", "abandoned", "forget", "missed"], answer: "missed", explanation: "'Missed connection' (ខកជើងយន្តហោះ)។"},
            {id: 80, year: 2017, category: "Vocabulary", question: "The fans climbed over the fence to _______ paying.", options: ["avoid", "prevent", "abandon", "refuse"], answer: "avoid", explanation: "'Avoid paying' (គេចវេះពីការបង់លុយ)។"},
            // 2016
            // Grammar
            {id: 81, year: 2016, category: "Grammar", question: "You must have something to eat before _______ to school.", options: ["go", "going", "to go", "of go"], answer: "going", explanation: "Before + V-ing (Gerund)។"},
            {id: 82, year: 2016, category: "Grammar", question: "You have never seen this before, _______ you?", options: ["haven't", "don't", "do", "have"], answer: "have", explanation: "Have never seen (Negative) -> have you (Positive)។"},
            {id: 83, year: 2016, category: "Grammar", question: "This problem _______ by this clever boy last night.", options: ["will be solved", "is solved", "was solved", "solved"], answer: "was solved", explanation: "Passive Voice (Past Simple): was solved។"},
            {id: 84, year: 2016, category: "Grammar", question: "What _______ you do if you won a lot of money?", options: ["will", "must", "would", "have"], answer: "would", explanation: "Second Conditional: If + won (Past), ... would + V1។"},
            {id: 85, year: 2016, category: "Grammar", question: "She was cleaning her teeth when the phone _______.", options: ["was going to ring", "was ringing", "rang", "ring"], answer: "rang", explanation: "Past Continuous (was cleaning) ... when ... Past Simple (rang)។"},
            // Vocabulary
            {id: 86, year: 2016, category: "Vocabulary", question: "What are you going to do when you _______ school?", options: ["conclude", "end", "complete", "leave"], answer: "leave", explanation: "'Leave school' (បញ្ចប់ការសិក្សា)។"},
            {id: 87, year: 2016, category: "Vocabulary", question: "The hotel services are bad, so we should write a _______ to the manager.", options: ["complaint", "message", "information", "essay"], answer: "complaint", explanation: "'Write a complaint' (សរសេរពាក្យបណ្ដឹង)។"},
            {id: 88, year: 2016, category: "Vocabulary", question: "Bopha cried out with _______ at the beautiful present Mr. Kimseng gave her.", options: ["depress", "horror", "anger", "delight"], answer: "delight", explanation: "'Delight' (សេចក្តីរីករាយ)។"},
            {id: 89, year: 2016, category: "Vocabulary", question: "Is it possible to _______ now for next term's evening classes?", options: ["send", "enroll", "join in", "enter"], answer: "enroll", explanation: "'Enroll' (ចុះឈ្មោះ)។"},
            {id: 90, year: 2016, category: "Vocabulary", question: "Most parents find it difficult to _______ their children nowadays.", options: ["bring up", "develop", "grow up", "set up"], answer: "bring up", explanation: "'Bring up' (ចិញ្ចឹមបីបាច់)។"},
            // 2015
            // Grammar
            {id: 91, year: 2015, category: "Grammar", question: "Angkor Wat temple _______ by thousands of tourists every month.", options: ["was visited", "visited", "are visited", "is visited"], answer: "is visited", explanation: "Passive Voice (Present Simple): is visited។"},
            {id: 92, year: 2015, category: "Grammar", question: "Mr. Sophal can't talk on the phone because he _______ dinner right now.", options: ["eats", "is eating", "has eaten", "has been eating"], answer: "is eating", explanation: "Present Continuous (is eating)។"},
            {id: 93, year: 2015, category: "Grammar", question: "I _______ the house before you called.", options: ["leave", "had left", "am leaving", "had been leaving"], answer: "had left", explanation: "Past Perfect: had left (បានចាកចេញមុន)។"},
            {id: 94, year: 2015, category: "Grammar", question: "If I found a wallet on the street, I _______ it to police station.", options: ["will take", "take", "would take", "am taking"], answer: "would take", explanation: "Second Conditional: If + found, ... would take។"},
            {id: 95, year: 2015, category: "Grammar", question: "The tree, _______ behind my house, gives a lot of shade.", options: ["grows", "which it grows", "which grows", "it grows"], answer: "which grows", explanation: "Relative Clause: 'Which grows'។"},
            // Vocabulary
            {id: 96, year: 2015, category: "Vocabulary", question: "How much do they _______ for cleaning your room?", options: ["demand", "cost", "charge", "need"], answer: "charge", explanation: "'Charge' (គិតថ្លៃ)។"},
            {id: 97, year: 2015, category: "Vocabulary", question: "In some countries, smoking in public places is _______ because many people are hurt of smoke.", options: ["prohibited", "increased", "encourage", "continued"], answer: "prohibited", explanation: "'Prohibited' (ហាមឃាត់)។"},
            {id: 98, year: 2015, category: "Vocabulary", question: "The government should _______ a law to make computer hacking illegal.", options: ["allow", "enter", "pass", "bring"], answer: "pass", explanation: "'Pass a law' (អនុម័តច្បាប់)។"},
            {id: 99, year: 2015, category: "Vocabulary", question: "The bad weather _______ the flight for several hours.", options: ["postponed", "delayed", "cancelled", "stopped"], answer: "delayed", explanation: "'Delayed' (យឺតយ៉ាវ)។"},
            {id: 100, year: 2015, category: "Vocabulary", question: "In recent years, inflation has almost double the _______ of living.", options: ["price", "expense", "charge", "cost"], answer: "cost", explanation: "'Cost of living' (តម្លៃនៃការរស់នៅ)។"},
            // 2014 (1)
            // Grammar
            {id: 101, year: "2014 (1)", category: "Grammar", question: "Although Ms. Thida _______ reservation, the hotel did not have a room for her.", options: ["made", "has made", "had made", "makes"], answer: "had made", explanation: "Past Perfect: had made (កក់ទុកមុន)។"},
            {id: 102, year: "2014 (1)", category: "Grammar", question: "I _______ on the bus when I dropped my wallet.", options: ["am getting", "have gotten", "get", "was getting"], answer: "was getting", explanation: "Past Continuous: was getting (កំពុងឡើងឡាន)។"},
            {id: 103, year: "2014 (1)", category: "Grammar", question: "Several trees fell down last night _______ the strong wind.", options: ["because of", "since", "because", "so"], answer: "because of", explanation: "'Because of' + Noun Phrase (the strong wind)។"},
            {id: 104, year: "2014 (1)", category: "Grammar", question: "We _______ at that restaurant during the last few months.", options: ["don't eat", "won't eat", "haven't eaten", "didn't eat"], answer: "haven't eaten", explanation: "Present Perfect (haven't eaten) សម្រាប់រយៈពេល។"},
            {id: 105, year: "2014 (1)", category: "Grammar", question: "Mr Dara _______ so many accidents if he drove more carefully.", options: ["would have", "won't have", "would have had", "wouldn't have"], answer: "wouldn't have", explanation: "Second Conditional: If + drove, ... wouldn't have។"},
            // Vocabulary
            {id: 106, year: "2014 (1)", category: "Vocabulary", question: "I'm really _______ of my son who won first prize.", options: ["pleased", "proud", "delighted", "happy"], answer: "proud", explanation: "'Proud of' (មានមោទកភាព)។"},
            {id: 107, year: "2014 (1)", category: "Vocabulary", question: "We all need to _______ responsibility for improving our local community.", options: ["have", "make", "take", "give"], answer: "take", explanation: "'Take responsibility' (ទទួលខុសត្រូវ)។"},
            {id: 108, year: "2014 (1)", category: "Vocabulary", question: "It's important to set yourself clear _______ so you know what you are aiming for.", options: ["ambitions", "opportunities", "decisions", "goals"], answer: "goals", explanation: "'Set goals' (កំណត់គោលដៅ)។"},
            {id: 109, year: "2014 (1)", category: "Vocabulary", question: "According to the weather _______, there will be rain tomorrow.", options: ["programme", "information", "survey", "forecast"], answer: "forecast", explanation: "'Weather forecast' (ការព្យាករណ៍អាកាសធាតុ)។"},
            {id: 110, year: "2014 (1)", category: "Vocabulary", question: "Many people believe that violent computer games can have a harmful _______ on children.", options: ["effect", "affect", "damage", "involvement"], answer: "effect", explanation: "'Effect' (ឥទ្ធិពល)។"},
            // 2014 (2)
            // Grammar
            {id: 111, year: "2014 (2)", category: "Grammar", question: "We _______ with the prime minister for dinner tonight.", options: ["will be met", "have been met", "were met", "are meeting"], answer: "are meeting", explanation: "Present Continuous សម្រាប់គម្រោងការអនាគត។"},
            {id: 112, year: "2014 (2)", category: "Grammar", question: "Mr Sambath _______ his vacation after the project is completed.", options: ["will take", "took", "has taken", "taking"], answer: "will take", explanation: "Future Simple: will take។"},
            {id: 113, year: "2014 (2)", category: "Grammar", question: "Mr Chantha _______ for the day when the phone call came.", options: ["has already left", "already leaves", "already left", "had already left"], answer: "had already left", explanation: "Past Perfect: had already left (បានចាកចេញមុន)។"},
            {id: 114, year: "2014 (2)", category: "Grammar", question: "If we keep _______ like this, we should be done before the deadline.", options: ["working", "worked", "to work", "work"], answer: "working", explanation: "'Keep' + V-ing (working)។"},
            {id: 115, year: "2014 (2)", category: "Grammar", question: "The benefits programme _______ in the next few months.", options: ["had changed", "were changed", "will be changed", "changed"], answer: "will be changed", explanation: "Future Passive: will be changed (នឹងត្រូវផ្លាស់ប្តូរ)។"},
            // Vocabulary
            {id: 116, year: "2014 (2)", category: "Vocabulary", question: "At the age of 60, Mr. Vuth retired and lived off his _______.", options: ["salary", "allowance", "grant", "pension"], answer: "pension", explanation: "'Pension' (ប្រាក់សោធននិវត្តន៍)។"},
            {id: 117, year: "2014 (2)", category: "Vocabulary", question: "Please confirm your reservation in _______.", options: ["letter", "writing", "words", "paper"], answer: "writing", explanation: "'In writing' (ជាលាយលក្ខណ៍អក្សរ)។"},
            {id: 118, year: "2014 (2)", category: "Vocabulary", question: "Everybody knew Samnang had _______ a crime but nobody wanted to tell the police.", options: ["committed", "done", "made", "performed"], answer: "committed", explanation: "'Committed a crime' (ប្រព្រឹត្តបទឧក្រិដ្ឋ)។"},
            {id: 119, year: "2014 (2)", category: "Vocabulary", question: "The researchers _______ many experiments to find the most effective materials.", options: ["considered", "confirmed", "concerned", "conducted"], answer: "conducted", explanation: "'Conducted experiments' (ធ្វើការពិសោធន៍)។"},
            {id: 120, year: "2014 (2)", category: "Vocabulary", question: "I _______ on the news that the price of gas is going up again.", options: ["looked", "listened", "heard", "watched"], answer: "heard", explanation: "'Heard on the news' (បានឮតាមព័ត៌មាន)។"}
        ];

        // --- SUB-COMPONENTS ---

        const WelcomeScreen = ({onStart, onTips, onDashboard}) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center fade-in bg-gradient-to-br from-blue-900 to-indigo-800 text-white w-full relative">
                    <div className="mb-8 p-6 bg-white bg-opacity-10 rounded-full shadow-2xl animate-bounce-slow">
                        <i className="fas fa-graduation-cap text-6xl text-yellow-400"></i>
                    </div>
                    <h1 className="text-4xl md:text-6xl font-bold mb-4 khmer-text text-yellow-300 drop-shadow-md">
                        អង់គ្លេសបាក់ឌុប
                    </h1>
                    <p className="text-lg md:text-xl mb-8 opacity-90 khmer-text max-w-lg">
                        កម្មវិធីប្រមូលផ្ដុំវិញ្ញាសាបាក់ឌុបចាប់ពីឆ្នាំ ២០១៤-២០២៥
                        <br />
                        <span className="text-yellow-200 text-sm mt-2 block font-sans">Grammar & Vocabulary Practice</span>
                    </p>

                    <div className="flex flex-col gap-4 w-full max-w-xs">
                        <button
                            onClick={onStart}
                            className="khmer-text bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 text-xl flex items-center justify-center gap-3"
                        >
                            <i className="fas fa-play"></i> ចាប់ផ្តើមប្រឡង
                        </button>
                        <button
                            onClick={onTips}
                            className="khmer-text bg-white hover:bg-gray-100 text-blue-900 font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 text-xl flex items-center justify-center gap-3"
                        >
                            <i className="fas fa-lightbulb"></i> គន្លឹះវេយ្យករណ៍ និង វាក្យសព្ទ
                        </button>
                        <button
                            onClick={onDashboard}
                            className="khmer-text bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 text-xl flex items-center justify-center gap-3"
                        >
                            <i className="fas fa-chart-line"></i> ប្រវត្តិសិក្សា
                        </button>
                    </div>

                    <div className="mt-12 text-sm opacity-60">
                        © 2026 BacII Prep. Updated from Official Exam 2014-2025.
                    </div>
                </div>
            );
        };

        // New Component: Tips Menu Screen
        const TipsMenuScreen = ({onSelectCategory, onBack}) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-50 text-center fade-in w-full">
                    <div className="max-w-2xl w-full">
                        <button
                            onClick={onBack}
                            className="self-start mb-6 text-gray-500 hover:text-blue-600 font-bold flex items-center gap-2 transition"
                        >
                            <i className="fas fa-arrow-left"></i> ត្រឡប់ក្រោយ
                        </button>

                        <h2 className="text-3xl font-bold text-gray-800 mb-8 khmer-text">គន្លឹះ និង វាក្យសព្ទ</h2>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* ប៊ូតុង វេយ្យាករណ៍ */}
                            <button
                                onClick={() => onSelectCategory('grammar-tips')}
                                className="bg-gradient-to-br from-green-500 to-green-700 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition transform hover:scale-105 flex flex-col items-center gap-4 group"
                            >
                                <div className="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center group-hover:bg-opacity-30 transition">
                                    <i className="fas fa-book-open text-3xl"></i>
                                </div>
                                <h3 className="text-2xl font-bold khmer-text">វេយ្យាករណ៍ (Grammar)</h3>
                                <p className="opacity-80 text-sm khmer-text">មេរៀនសង្ខេប និងរូបមន្តសំខាន់ៗ</p>
                            </button>

                            {/* ប៊ូតុង Flashcard (វាក្យសព្ទ១០២ពាក្យ + ពាក្យបង្កើតខ្លួនឯង) */}
                            <button
                                onClick={() => onSelectCategory('flashcards')}
                                className="bg-gradient-to-br from-indigo-500 to-indigo-700 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition transform hover:scale-105 flex flex-col items-center gap-4 group"
                            >
                                <div className="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center group-hover:bg-opacity-30 transition">
                                    <i className="fas fa-clone text-3xl"></i>
                                </div>
                                <h3 className="text-2xl font-bold khmer-text">ហ្វឹកហាត់ Flashcards</h3>
                                <p className="opacity-80 text-sm khmer-text">រៀនទន្ទេញ និងបង្កើតពាក្យថ្មី</p>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };
        // New Component: Grammar Tips Screen
        const GrammarTipsScreen = ({onBack}) => {
            return (
                <div className="flex flex-col min-h-screen bg-gray-50 w-full">
                    <div className="bg-white shadow-md p-4 sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto flex items-center gap-3">
                            <button onClick={onBack} className="text-gray-500 hover:text-blue-600 transition">
                                <i className="fas fa-arrow-left text-xl"></i>
                            </button>
                            <h2 className="text-xl font-bold text-gray-800 khmer-text">គន្លឹះវេយ្យាករណ៍</h2>
                        </div>
                    </div>

                    <div className="flex-1 p-4 max-w-3xl mx-auto w-full fade-in pb-20 custom-scroll overflow-y-auto">
                        <div className="space-y-6">
                            {grammarTipsData.map((tip, index) => (
                                <div key={index} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                    <div className="bg-blue-50 p-4 border-b border-blue-100">
                                        <h3 className="text-lg font-bold text-blue-900 khmer-text">{tip.title}</h3>
                                    </div>
                                    <div className="p-5">
                                        <p className="text-gray-700 mb-3 khmer-text">{tip.content}</p>
                                        <div className="bg-gray-50 p-3 rounded-lg border border-gray-200 mb-4 font-mono text-sm text-blue-600">
                                            <i className="fas fa-flask mr-2"></i>Formula: {tip.formula}
                                        </div>
                                        <div className="space-y-2">
                                            <p className="text-xs font-bold text-gray-400 uppercase">Examples:</p>
                                            <ul className="list-disc list-inside space-y-1 text-gray-800 text-sm">
                                                {tip.examples.map((ex, i) => (
                                                    <li key={i} dangerouslySetInnerHTML={{__html: ex}}></li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AddFlashcardModal = ({onClose, onSave}) => {
            const [word, setWord] = useState('');
            const [phonetic, setPhonetic] = useState('');
            const [type, setType] = useState('');
            const [meaning, setMeaning] = useState('');
            const [exampleEn, setExampleEn] = useState('');
            const [exampleKh, setExampleKh] = useState('');

            const handleSave = () => {
                if (!word.trim() || !meaning.trim()) {
                    alert("សូមបញ្ចូលពាក្យអង់គ្លេស និងការបកប្រែជាខ្មែរឱ្យបានត្រឹមត្រូវ!");
                    return;
                }
                onSave({word, phonetic, type, meaning, exampleEn, exampleKh});
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[80] p-4 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
                        <div className="bg-indigo-600 p-5 flex justify-between items-center text-white">
                            <h2 className="text-xl font-bold khmer-text"><i className="fas fa-plus-circle mr-2"></i>បង្កើតពាក្យថ្មី</h2>
                            <button onClick={onClose} className="hover:text-red-300 transition text-2xl"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto custom-scroll">
                            <div><label className="block text-sm font-bold text-gray-700 mb-1 khmer-text">ពាក្យអង់គ្លេស *</label><input type="text" value={word} onChange={(e) => setWord(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 font-bold text-indigo-700" /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1 khmer-text">ការបញ្ចេញសំឡេង</label><input type="text" value={phonetic} onChange={(e) => setPhonetic(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 font-mono text-gray-600" placeholder="/səkˈses/" /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1 khmer-text">ថ្នាក់ពាក្យ</label><input type="text" value={type} onChange={(e) => setType(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500" placeholder="N, V, Adj" /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1 khmer-text">អត្ថន័យជាខ្មែរ *</label><input type="text" value={meaning} onChange={(e) => setMeaning(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 khmer-text font-bold text-yellow-600" /></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1 khmer-text">ឧទាហរណ៍អង់គ្លេស</label><textarea value={exampleEn} onChange={(e) => setExampleEn(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500" rows="2"></textarea></div>
                            <div><label className="block text-sm font-bold text-gray-700 mb-1 khmer-text">បកប្រែឧទាហរណ៍</label><textarea value={exampleKh} onChange={(e) => setExampleKh(e.target.value)} className="w-full border-2 border-gray-200 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 khmer-text" rows="2"></textarea></div>
                            <button onClick={handleSave} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-105 khmer-text mt-4 text-lg"><i className="fas fa-save mr-2"></i>រក្សាទុកពាក្យ</button>
                        </div>
                    </div>
                </div>
            );
        };
        // New Component: Flashcard Screen
        const FlashcardScreen = ({vocabList, onBack, onAddNew}) => {
        const [currentIndex, setCurrentIndex] = useState(0);
        const [isFlipped, setIsFlipped] = useState(false);
        
        if (!vocabList || vocabList.length === 0) return <div className="min-h-screen flex items-center justify-center">No Data</div>;
        
        const nextCard = () => { setIsFlipped(false); setTimeout(() => { setCurrentIndex((prev) => (prev + 1) % vocabList.length); }, 150); };
        const prevCard = () => { setIsFlipped(false); setTimeout(() => { setCurrentIndex((prev) => (prev - 1 + vocabList.length) % vocabList.length); }, 150); };
        const card = vocabList[currentIndex];

        return (
            <div className="flex flex-col min-h-screen bg-gray-50 w-full fade-in">
                <div className="bg-white shadow-md p-4 sticky top-0 z-10">
                    <div className="max-w-3xl mx-auto flex justify-between items-center">
                        <button onClick={onBack} className="text-gray-500 hover:text-blue-600 transition font-bold"><i className="fas fa-arrow-left text-xl"></i> ត្រឡប់ក្រោយ</button>
                        <h2 className="text-xl font-bold text-gray-800 khmer-text hidden md:block">Flashcard {currentIndex + 1}/{vocabList.length}</h2>
                        <button onClick={onAddNew} className="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 text-sm khmer-text shadow-sm">
                            <i className="fas fa-plus"></i> បន្ថែមពាក្យ
                        </button>
                    </div>
                </div>
                <div className="flex-1 flex flex-col items-center justify-center p-4">
                    
                    {/* កែប្រែ Hover Scale មកដាក់លើ Container ធំវិញ ដើម្បីកុំឱ្យជាន់គ្នាជាមួយ Rotate 3D */}
                    <div className="relative w-full max-w-md h-[400px] perspective-1000 cursor-pointer group hover:scale-105 transition-transform duration-300" onClick={() => setIsFlipped(!isFlipped)}>
