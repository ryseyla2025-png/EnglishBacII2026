                                <ul className="space-y-3">
                                    {lesson.examples.map((ex, i) => (
                                        <li key={i} className="bg-gray-50 p-3 rounded-lg border-l-4 border-green-500 text-gray-800" dangerouslySetInnerHTML={{__html: ex}}></li>
                                    ))}
                                </ul>
                            </div>

                            <button
                                onClick={() => setShowLesson(false)}
                                className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg khmer-text"
                            >
                                <i className="fas fa-arrow-left mr-2"></i> ត្រឡប់ទៅផ្ទាំងចម្លើយវិញ
                            </button>
                        </div>
                    </div>
                );
            }

            // ផ្ទាំងចម្លើយខុស/ត្រូវ ធម្មតា
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className={`bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md text-center transform transition-all scale-100 ${isCorrect ? 'border-b-8 border-green-500' : 'border-b-8 border-red-500'}`}>
                        <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 ${isCorrect ? 'bg-green-100 text-green-500' : 'bg-red-100 text-red-500'}`}>
                            <i className={`fas ${isCorrect ? 'fa-check' : 'fa-times'} text-4xl`}></i>
                        </div>

                        <h2 className={`text-2xl font-bold mb-2 khmer-text ${isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                            {isCorrect ? 'ត្រឹមត្រូវ!' : 'មិនត្រឹមត្រូវ!'}
                        </h2>

                        {!isCorrect && (
                            <div className="mb-4">
                                <p className="text-gray-500 text-sm mb-1">ចម្លើយដែលត្រូវគឺ៖</p>
                                <p className="text-lg font-bold text-gray-800">{correctAnswer}</p>
                            </div>
                        )}

                        <div className="bg-gray-50 p-4 rounded-lg text-left mb-6 border border-gray-100">
                            <p className="text-xs text-gray-400 font-bold uppercase mb-2">ការពន្យល់ (Explanation)</p>
                            <p className="text-sm text-gray-700 khmer-text leading-relaxed">{explanation}</p>
                        </div>

                        <div className="flex flex-col gap-3">
                            {/* បង្ហាញប៊ូតុង សិក្សាមេរៀន តែពេលឆ្លើយខុស និងមានមេរៀនពាក់ព័ន្ធ */}
                            {!isCorrect && lesson && (
                                <button
                                    onClick={() => setShowLesson(true)}
                                    className="w-full py-3 px-6 rounded-xl font-bold text-blue-700 bg-blue-100 hover:bg-blue-200 shadow-sm transition transform hover:scale-105 khmer-text flex items-center justify-center gap-2"
                                >
                                    <i className="fas fa-book-open"></i> សិក្សាមេរៀននេះឡើងវិញ
                                </button>
                            )}

                            <button
                                onClick={onNext}
                                className={`w-full py-3 px-6 rounded-xl font-bold text-white shadow-lg transition transform hover:scale-105 khmer-text flex items-center justify-center gap-2 ${isCorrect ? 'bg-green-500 hover:bg-green-600' : 'bg-gray-800 hover:bg-gray-900'}`}
                            >
                                បន្តទៅមុខ <i className="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ResultScreen = ({score, totalQuestions, onRestart, onHome}) => {
            const percentage = totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0;
            let message = "";
            let color = "";
            let icon = "";

            if (percentage >= 90) {
                message = "អស្ចារ្យណាស់! និទ្ទេស A";
                color = "text-green-600";
                icon = "fa-trophy";
            } else if (percentage >= 75) {
                message = "ល្អណាស់! និទ្ទេស B";
                color = "text-blue-600";
                icon = "fa-medal";
            } else if (percentage >= 50) {
                message = "ល្អបង្គួរ! និទ្ទេស C/D";
                color = "text-yellow-600";
                icon = "fa-thumbs-up";
            } else {
                message = "ខិតខំប្រឹងប្រែងបន្ថែមទៀតណា!";
                color = "text-red-600";
                icon = "fa-book-reader";
            }

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-50 text-center fade-in w-full">
                    <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl max-w-lg w-full">
                        <div className={`mb-6 flex justify-center text-6xl ${color}`}>
                            <i className={`fas ${icon} animate-bounce`}></i>
                        </div>
                        <h2 className="text-3xl font-bold text-gray-800 mb-2 khmer-text">លទ្ធផលរបស់អ្នក</h2>
                        <div className="text-6xl font-bold text-gray-900 my-6">
                            {score}<span className="text-2xl text-gray-400">/{totalQuestions}</span>
                        </div>
                        <p className={`text-xl mb-8 font-bold khmer-text ${color}`}>
                            {message}
                        </p>

                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-gray-100 p-4 rounded-xl">
                                <p className="text-gray-500 text-sm">ពិន្ទុសរុប</p>
                                <p className="text-xl font-bold">{percentage}%</p>
                            </div>
                            <div className="bg-gray-100 p-4 rounded-xl">
                                <p className="text-gray-500 text-sm">បានបញ្ចប់</p>
                                <p className="text-xl font-bold">100%</p>
                            </div>
                        </div>

                        <div className="flex flex-col gap-3">
                            <button
                                onClick={onRestart}
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition transform hover:scale-105 flex items-center justify-center gap-2 khmer-text"
                            >
                                <i className="fas fa-redo"></i> ធ្វើតេស្តម្ដងទៀត
                            </button>
                            <button
                                onClick={onHome}
                                className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-4 px-8 rounded-xl transition flex items-center justify-center gap-2 khmer-text"
                            >
                                <i className="fas fa-home"></i> ទៅកាន់ម៉ឺនុយដើម
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // New Component: Progress Dashboard Screen
        const DashboardScreen = ({onBack}) => {
            const [history, setHistory] = useState([]);

            useEffect(() => {
                // ទាញយកទិន្នន័យពី LocalStorage ពេលបើកផ្ទាំងនេះ
                const savedData = JSON.parse(localStorage.getItem('bac2_english_progress') || '[]');
                setHistory(savedData);
            }, []);

            const clearHistory = () => {
                if (window.confirm("តើអ្នកពិតជាចង់លុបប្រវត្តិសិក្សាទាំងអស់មែនទេ?")) {
                    localStorage.removeItem('bac2_english_progress');
                    setHistory([]);
                }
            };

            const totalTests = history.length;
            const avgScore = totalTests > 0 ? Math.round(history.reduce((acc, curr) => acc + curr.percentage, 0) / totalTests) : 0;

            return (
                <div className="flex flex-col min-h-screen bg-gray-50 w-full fade-in">
                    <div className="bg-white shadow-md p-4 sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <button onClick={onBack} className="text-gray-500 hover:text-blue-600 transition">
                                    <i className="fas fa-arrow-left text-xl"></i>
                                </button>
                                <h2 className="text-xl font-bold text-gray-800 khmer-text">ប្រវត្តិសិក្សា</h2>
                            </div>
                            {totalTests > 0 && (
                                <button onClick={clearHistory} className="text-red-500 hover:text-red-700 text-sm font-bold khmer-text">
                                    លុបទិន្នន័យ
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="flex-1 p-4 max-w-3xl mx-auto w-full pb-20 custom-scroll overflow-y-auto">
                        {/* Summary Cards */}
                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-gradient-to-br from-blue-500 to-indigo-600 p-6 rounded-2xl shadow-lg text-white text-center transform transition hover:scale-105">
                                <i className="fas fa-tasks text-3xl mb-2 opacity-80"></i>
                                <h3 className="text-3xl font-bold">{totalTests}</h3>
                                <p className="text-sm khmer-text opacity-90 mt-1">ចំនួនតេស្តបានធ្វើ</p>
                            </div>
                            <div className={`p-6 rounded-2xl shadow-lg text-white text-center transform transition hover:scale-105 ${avgScore >= 75 ? 'bg-gradient-to-br from-green-400 to-green-600' : avgScore >= 50 ? 'bg-gradient-to-br from-yellow-400 to-orange-500' : 'bg-gradient-to-br from-red-400 to-red-600'}`}>
                                <i className="fas fa-chart-line text-3xl mb-2 opacity-80"></i>
                                <h3 className="text-3xl font-bold">{avgScore}%</h3>
                                <p className="text-sm khmer-text opacity-90 mt-1">ពិន្ទុមធ្យមភាគ</p>
                            </div>
                        </div>

                        {/* History List */}
                        <h3 className="text-lg font-bold text-gray-700 mb-4 khmer-text">លទ្ធផលថ្មីៗ</h3>
                        {totalTests === 0 ? (
                            <div className="bg-white p-8 rounded-2xl shadow-sm text-center border border-gray-100">
                                <i className="fas fa-folder-open text-4xl text-gray-300 mb-3"></i>
                                <p className="text-gray-500 khmer-text">មិនទាន់មានប្រវត្តិធ្វើតេស្តនៅឡើយទេ</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {history.map((record, index) => (
                                    <div key={index} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition">
                                        <div>
                                            <h4 className="font-bold text-gray-800">{record.mode}</h4>
                                            <p className="text-xs text-gray-400"><i className="far fa-clock"></i> {record.date}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className={`font-bold text-lg ${record.percentage >= 75 ? 'text-green-600' : record.percentage >= 50 ? 'text-yellow-600' : 'text-red-600'}`}>
                                                {record.score} / {record.total}
                                            </p>
                                            <p className="text-xs font-bold text-gray-400">{record.percentage}%</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            // Game States: 'welcome', 'tips-menu', 'grammar-tips', 'vocab-list', 'year-menu', 'category-menu', 'playing', 'playing-reading', 'writing-screen', 'feedback', 'result', 'goodbye'
            const [gameState, setGameState] = useState('welcome');

            // Selections
            const [selectedYear, setSelectedYear] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [activeQuestions, setActiveQuestions] = useState([]); // Questions filtered by Year & Category
            const [activeReading, setActiveReading] = useState(null);
            const [readingAnswers, setReadingAnswers] = useState({}); // { gapIndex: "answer" }
            const [showReadingResult, setShowReadingResult] = useState(false);
            const [readingScore, setReadingScore] = useState(0);

            // Drag and Drop State
            const [draggedWord, setDraggedWord] = useState(null); // { word: string, sourceIndex: number|null (null = box) }

            // Gameplay States
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [timer, setTimer] = useState(60);
            // --- មុខងាររក្សាទុកប្រវត្តិសិក្សា (Save Progress) ---
            const saveProgress = (modeName, currentScore, totalItems) => {
                const now = new Date();
                const dateString = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});

                const newRecord = {
                    date: dateString,
                    mode: modeName,
                    score: currentScore,
                    total: totalItems,
                    percentage: Math.round((currentScore / totalItems) * 100)
                };

                const existingData = JSON.parse(localStorage.getItem('bac2_english_progress') || '[]');
                // រក្សាទុកតែ ៥០ ដងចុងក្រោយប៉ុណ្ណោះ ដើម្បីកុំឱ្យធ្ងន់ទូរស័ព្ទ
                const updatedData = [newRecord, ...existingData].slice(0, 50);
                localStorage.setItem('bac2_english_progress', JSON.stringify(updatedData));
            };
            const [lastAnswerCorrect, setLastAnswerCorrect] = useState(false);
            const [isMusicPlaying, setIsMusicPlaying] = useState(false);
            // --- DARK MODE LOGIC ---
            const [isDarkMode, setIsDarkMode] = useState(false);

            // ទាញយក Theme ចាស់ពេលបើកកម្មវិធី
            useEffect(() => {
                const savedTheme = localStorage.getItem('bac2_theme');
                if (savedTheme === 'dark') {
                    setIsDarkMode(true);
                    document.body.classList.add('dark-mode');
                }
            }, []);

            const toggleDarkMode = () => {
                playSound('click');
                if (isDarkMode) {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('bac2_theme', 'light');
                    setIsDarkMode(false);
                } else {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('bac2_theme', 'dark');
                    setIsDarkMode(true);
                }
            };
            // --- BOOKMARK LOGIC ---
            const [bookmarkedIds, setBookmarkedIds] = useState([]);

            // --- បន្ថែម State ថ្មីនេះចូល ---
            const [customVocab, setCustomVocab] = useState([]);
            const [showAddFlashcard, setShowAddFlashcard] = useState(false);

            // បញ្ចូលកូដនេះទៅក្នុង useEffect ដើមរបស់លោកគ្រូ
            useEffect(() => {
                if (localStorage.getItem('bac2_theme') === 'dark') {setIsDarkMode(true); document.body.classList.add('dark-mode');}
                setBookmarkedIds(JSON.parse(localStorage.getItem('bac2_bookmarks') || '[]'));
                // បន្ថែមបន្ទាត់នេះ
                setCustomVocab(JSON.parse(localStorage.getItem('bac2_custom_vocab') || '[]'));
            }, []);

            // --- បន្ថែម Function ថ្មីសម្រាប់រក្សាទុកពាក្យ ---
            const handleAddCustomVocab = (newVocab) => {
                const updated = [newVocab, ...customVocab];
                setCustomVocab(updated);
                localStorage.setItem('bac2_custom_vocab', JSON.stringify(updated));
            };

            const combinedVocabList = [...customVocab, ...readingVocabData];

            // ទាញយក Bookmarks ពី LocalStorage ពេលបើកកម្មវិធី
            useEffect(() => {
                const savedBookmarks = JSON.parse(localStorage.getItem('bac2_bookmarks') || '[]');
                setBookmarkedIds(savedBookmarks);
            }, []);

            const handleToggleBookmark = (questionId) => {
                playSound('click');
                let updatedBookmarks;
                if (bookmarkedIds.includes(questionId)) {
                    updatedBookmarks = bookmarkedIds.filter(id => id !== questionId);
                } else {
                    updatedBookmarks = [...bookmarkedIds, questionId];
                }
                setBookmarkedIds(updatedBookmarks);
                localStorage.setItem('bac2_bookmarks', JSON.stringify(updatedBookmarks));
            };

            const startBookmarkTest = () => {
                if (bookmarkedIds.length === 0) {
                    alert("អ្នកមិនទាន់មានកត់ត្រាសំណួរទុកនៅឡើយទេ។ សូមចុចសញ្ញាផ្កាយ (⭐) ពេលកំពុងធ្វើតេស្ត ដើម្បីកត់ត្រាវាទុក!");
                    return;
                }
                // ទាញយកតែសំណួរណាដែលមាន ID ក្នុង bookmarkedIds
                const filtered = allQuestionsData.filter(q => bookmarkedIds.includes(q.id));
                const shuffled = [...filtered].sort(() => 0.5 - Math.random());

                setActiveQuestions(shuffled);
                setSelectedYear('Review'); // ដាក់ឈ្មោះថា Review
                setSelectedCategory('Bookmarks');
                setScore(0);
                setStreak(0);
                setCurrentQuestionIndex(0);
                setTimer(60);
                setGameState('playing');
            };

            const bgMusicRef = useRef(null);

            // Audio synthesis
            const playSound = (type) => {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }
            };

            // Timer Logic
            useEffect(() => {
                let interval;
                if (gameState === 'playing' && timer > 0) {
                    interval = setInterval(() => {
                        setTimer((prev) => prev - 1);
                    }, 1000);
                } else if (timer === 0 && gameState === 'playing') {
                    handleTimeOut();
                }
                return () => clearInterval(interval);
            }, [gameState, timer]);

            // --- NAVIGATION HANDLERS ---

            // ស្វែងរក handleStartApp រួចកែវាទៅជា៖
            const handleStartApp = () => {
                playSound('click');
                setGameState('test-mode-menu'); // ប្តូរពី 'year-menu' ទៅ 'test-mode-menu'

                if (bgMusicRef.current && !isMusicPlaying) {
                    bgMusicRef.current.volume = 0.2;
                    bgMusicRef.current.play().then(() => {
                        setIsMusicPlaying(true);
                    }).catch(e => console.log("Audio prevented or offline"));
                }
            };

            // បន្ថែម Functions ថ្មីទាំងនេះពីក្រោម handleStartApp៖
            const handleSelectTestMode = (mode) => {
                playSound('click');
                if (mode === 'by-year') {
                    setGameState('year-menu');
                } else if (mode === 'pure-grammar') {
                    startPureTest('Grammar');
                } else if (mode === 'pure-vocab') {
                    startPureTest('Vocabulary');
                } else if (mode === 'bookmarks') {
                    startBookmarkTest(); // ហៅ Function ធ្វើតេស្តសំណួរពិបាក
                }
            };

            const startPureTest = (category) => {
                const filtered = allQuestionsData.filter(q => q.category === category);
                const shuffled = [...filtered].sort(() => 0.5 - Math.random()); // លាយសំណួរឲ្យចេញខុសៗគ្នា

                setActiveQuestions(shuffled);
                setSelectedYear('All Years'); // សម្គាល់ថាវាជាតេស្តសរុប
                setSelectedCategory(category);
                setScore(0);
                setStreak(0);
                setCurrentQuestionIndex(0);
                setTimer(60);
                setGameState('playing');
            };

            const handleBackFromQuiz = () => {
                playSound('click');
                if (selectedYear === 'All Years') {
                    setGameState('test-mode-menu'); // ត្រលប់ទៅម៉ឺនុយតេស្តវិញ ប្រសិនបើជាតេស្តសុទ្ធ
                } else {
                    setGameState('category-menu');
                }
            };

            const handleTipsMenu = () => {
                playSound('click');
                setGameState('tips-menu');
            };

            const handleSelectTipCategory = (category) => {
                playSound('click');
                setGameState(category); // 'grammar-tips' or 'vocab-list'
            };

            const handleBackToTipsMenu = () => {
                playSound('click');
                setGameState('tips-menu');
            }

            const handleSelectYear = (year) => {
                playSound('click');
                setSelectedYear(year);
                setGameState('category-menu');
            };

            const handleSelectCategory = (category) => {
                playSound('click');
                setSelectedCategory(category);

                if (category === 'Reading') {
                    handleSelectReading(selectedYear);
                    return;
                }
                if (category === 'Writing') {
                    setGameState('writing-screen');
                    return;
                }

                // Filter questions based on selection
                const filtered = allQuestionsData.filter(q => q.year.toString() === selectedYear.toString() && q.category === category);

                setActiveQuestions(filtered);
                setScore(0);
                setStreak(0);
                setCurrentQuestionIndex(0);
                setTimer(60);

                if (filtered.length > 0) {
                    setGameState('playing');
                } else {
                    setGameState('result');
                }
            };

            const handleSelectReading = (year) => {
                const data = readingData.find(d => d.year.toString() === year.toString());
                if (data) {
                    setActiveReading(data);
                    setReadingAnswers({});
                    setShowReadingResult(false);
                    setReadingScore(0);
                    setGameState('playing-reading');
                } else {
                    alert("Reading section coming soon for this year!");
                }
            };

            // --- DRAG AND DROP HANDLERS ---
            const handleDragStart = (e, word, sourceIndex) => {
                setDraggedWord({word, sourceIndex});
                e.dataTransfer.setData("text/plain", word); // For standard HTML5 DnD compatibility
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e) => {
                e.preventDefault(); // Necessary to allow dropping
                e.dataTransfer.dropEffect = "move";
            };

            const handleDrop = (e, targetIndex) => {
                e.preventDefault();
                if (!draggedWord) return;

                const newAnswers = {...readingAnswers};

                // Logic: 
                // 1. If coming from another gap (sourceIndex !== null), remove from there.
                // 2. Place word in target gap.
                // 3. If target gap had a word, and we came from a gap, maybe swap? 
                //    (Let's just overwrite for simplicity, or swap if user intent is clear. Swap is better UX).

                const existingWordInTarget = newAnswers[targetIndex];

                // Remove from old location if it was a gap
                if (draggedWord.sourceIndex !== null) {
                    delete newAnswers[draggedWord.sourceIndex];
                }

                // If we are swapping (Gap A -> Gap B, and Gap B had a word)
                if (existingWordInTarget && draggedWord.sourceIndex !== null) {
                    newAnswers[draggedWord.sourceIndex] = existingWordInTarget;
                }

                // Place new word
                newAnswers[targetIndex] = draggedWord.word;

                setReadingAnswers(newAnswers);
                setDraggedWord(null);
                playSound('click');
            };

            const handleClearGap = (index) => {
                if (showReadingResult) return;
                const newAnswers = {...readingAnswers};
                delete newAnswers[index];
                setReadingAnswers(newAnswers);
            };

            const submitReading = () => {
                let correctCount = 0;
                activeReading.answers.forEach((ans, index) => {
                    if (readingAnswers[index] === ans) correctCount++;
                });
                setReadingScore(correctCount);
                setShowReadingResult(true);

                // Save Progress សម្រាប់ Reading
                saveProgress(`Year ${activeReading.year} - Reading`, correctCount, activeReading.answers.length);

                if (correctCount === activeReading.answers.length) {
                    playSound('correct');
                }
            };

            const renderReadingText = () => {
                if (!activeReading) return null;

                return (
                    <div className="leading-relaxed text-lg text-gray-800 text-justify">
                        <h3 className="text-2xl font-bold text-center mb-6 text-blue-800">{activeReading.title}</h3>

                        {/* Word Box Display - Draggable Sources */}
                        <div className="bg-blue-50 p-4 rounded-xl border-2 border-blue-100 mb-8 sticky top-20 z-10 shadow-md">
                            <p className="text-sm text-gray-500 mb-2 font-bold uppercase">Drag words from here:</p>
                            <div className="flex flex-wrap gap-2">
                                {activeReading.wordBox.map((word, i) => (
                                    <div
                                        key={i}
                                        draggable={!showReadingResult}
                                        onDragStart={(e) => handleDragStart(e, word, null)}
                                        className={`bg-white px-4 py-2 rounded-lg text-blue-700 shadow-sm border border-blue-200 font-bold text-sm cursor-grab active:cursor-grabbing hover:bg-blue-100 transition transform hover:scale-105 select-none draggable-word`}
                                    >
                                        {word}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Text with Drop Zones */}
                        <div className="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                            {activeReading.segments.map((segment, index) => (
                                <React.Fragment key={index}>
                                    <span dangerouslySetInnerHTML={{__html: segment}} />
                                    {index < activeReading.answers.length && (
                                        <span
                                            className={`drop-zone ${readingAnswers[index] ? 'filled' : ''} ${showReadingResult ? (readingAnswers[index] === activeReading.answers[index] ? 'correct' : 'wrong') : ''}`}
                                            onDragOver={!showReadingResult ? handleDragOver : undefined}
                                            onDrop={!showReadingResult ? (e) => handleDrop(e, index) : undefined}
                                            onClick={() => handleClearGap(index)}
                                        >
                                            {readingAnswers[index] ? (
                                                <span
                                                    draggable={!showReadingResult}
                                                    onDragStart={(e) => {
                                                        e.stopPropagation(); // Prevent parent click
                                                        handleDragStart(e, readingAnswers[index], index);
                                                    }}
                                                    className="w-full text-center block"
                                                >
                                                    {readingAnswers[index]}
                                                </span>
                                            ) : (
                                                <span className="text-gray-300 text-sm pointer-events-none">Drop Here</span>
                                            )}

                                            {showReadingResult && readingAnswers[index] !== activeReading.answers[index] && (
                                                <span className="text-red-500 text-xs ml-2 font-bold whitespace-nowrap">
                                                    ({activeReading.answers[index]})
                                                </span>
                                            )}
                                        </span>
                                    )}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>
                );
            };

            const handleBackToYear = () => {
                playSound('click');
                setSelectedYear(null);
                setGameState('year-menu');
            };

            const handleBackToCategory = () => {
                playSound('click');
                setSelectedCategory(null);
                setGameState('category-menu');
            };

            const handleGoHome = () => {
                playSound('click');
                setSelectedYear(null);
                setSelectedCategory(null);
                setGameState('year-menu');
            };

            const handleExit = () => {
                playSound('click');
                setGameState('goodbye');
            }

            // --- GAMEPLAY HANDLERS ---

            const toggleMusic = () => {
                if (isMusicPlaying) {
                    bgMusicRef.current.pause();
                } else {
                    bgMusicRef.current.play();
                }
                setIsMusicPlaying(!isMusicPlaying);
            };

            const handleAnswer = (selectedOption) => {
                const currentQuestion = activeQuestions[currentQuestionIndex];
                const isCorrect = selectedOption === currentQuestion.answer;

                if (isCorrect) {
                    playSound('correct');
                    setScore(score + 1);
                    setStreak(streak + 1);
                } else {
                    playSound('wrong');
                    setStreak(0);
                }

                setLastAnswerCorrect(isCorrect);
                setGameState('feedback');
            };

            const handleTimeOut = () => {
                playSound('wrong');
                setLastAnswerCorrect(false);
                setStreak(0);
                setGameState('feedback');
            };

            const handleNextQuestion = () => {
                playSound('click');
                if (currentQuestionIndex + 1 < activeQuestions.length) {
                    setCurrentQuestionIndex(currentQuestionIndex + 1);
                    setTimer(60);
                    setGameState('playing');
                } else {
                    // Save Progress មុនពេលបង្ហាញលទ្ធផល
                    const testModeName = selectedYear === 'All Years' ? `Pure ${selectedCategory}` : `Year ${selectedYear} - ${selectedCategory}`;
                    saveProgress(testModeName, score, activeQuestions.length);

                    setGameState('result');
                }
            };

            const handleRestart = () => {
                playSound('click');
                setScore(0);
                setStreak(0);
                setCurrentQuestionIndex(0);
                setTimer(60);
                setGameState('playing');
            };

            return (
                <div className="relative min-h-screen bg-gray-50">
                    {/* Background Music - Source removed for Offline safety, or keep local if available */}
                    {/* <audio ref={bgMusicRef} loop>
                    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg" />
                </audio> */}

                    {/* Music Toggle - Hidden since audio is removed for offline */}
                    {/* {gameState !== 'welcome' && gameState !== 'goodbye' && (
                    <button 
                        onClick={toggleMusic} 
                        className="fixed bottom-4 right-4 z-50 bg-white p-3 rounded-full shadow-lg text-gray-700 hover:text-blue-600 transition"
                    >
                        <i className={`fas ${isMusicPlaying ? 'fa-volume-up' : 'fa-volume-mute'}`}></i>
                    </button>
                )} 
                */}

                    {gameState === 'welcome' && (
                        <WelcomeScreen
                            onStart={handleStartApp}
                            onTips={handleTipsMenu}
                            onDashboard={() => setGameState('dashboard')} // បន្ថែមចំណុចនេះ
                            onExit={handleExit}
                        />
                    )}

                    {/* បន្ថែមចំណុចនេះពីក្រោម WelcomeScreen */}
                    {gameState === 'dashboard' && (
                        <DashboardScreen onBack={() => setGameState('welcome')} />
                    )}

                    {gameState === 'test-mode-menu' && (
                        <TestModeMenuScreen
                            onSelectMode={handleSelectTestMode}
                            onBack={() => setGameState('welcome')}
                        />
                    )}

                    {gameState === 'goodbye' && (
                        <GoodbyeScreen />
                    )}

                    {gameState === 'tips-menu' && (
                        <TipsMenuScreen
                            onSelectCategory={handleSelectTipCategory}
                            onBack={() => setGameState('welcome')}
                        />
                    )}

                    {gameState === 'grammar-tips' && (
                        <GrammarTipsScreen onBack={handleBackToTipsMenu} />
                    )}

                    {/* បន្ថែមចំណុចនេះ សម្រាប់ Flashcards */}
                    {/* ជំនួសកន្លែងហៅ FlashcardScreen ចាស់ ដោយកូដនេះ */}
                    {gameState === 'flashcards' && (
                        <FlashcardScreen
                            vocabList={combinedVocabList}
                            onBack={() => setGameState('tips-menu')}
                            onAddNew={() => setShowAddFlashcard(true)}
                        />
                    )}

                    {showAddFlashcard && (
                        <AddFlashcardModal
                            onClose={() => setShowAddFlashcard(false)}
                            onSave={handleAddCustomVocab}
                        />
                    )}

                    {gameState === 'year-menu' && (
                        <YearMenuScreen
                            onSelectYear={handleSelectYear}
                            onBack={() => setGameState('welcome')}
                        />
                    )}

                    {gameState === 'category-menu' && (
                        <CategoryMenuScreen
                            selectedYear={selectedYear}
                            onSelectCategory={handleSelectCategory}
                            onBack={handleBackToYear}
                        />
                    )}

                    {gameState === 'playing' && (
                        <QuizScreen
                            questionData={activeQuestions[currentQuestionIndex]}
                            currentQuestionIndex={currentQuestionIndex}
                            totalQuestions={activeQuestions.length}
                            onAnswer={handleAnswer}
                            timer={timer}
                            score={score}
                            streak={streak}
                            year={selectedYear}
                            category={selectedCategory}
                            onBack={handleBackFromQuiz}

                            // បន្ថែម ២ បន្ទាត់នេះ
                            isBookmarked={bookmarkedIds.includes(activeQuestions[currentQuestionIndex]?.id)}
                            onToggleBookmark={() => handleToggleBookmark(activeQuestions[currentQuestionIndex]?.id)}
                        />
                    )}

                    {gameState === 'playing-reading' && activeReading && (
                        <div className="flex flex-col min-h-screen bg-gray-50 w-full">
                            {/* Header */}
                            <div className="bg-white shadow-md p-4 sticky top-0 z-20">
                                <div className="max-w-4xl mx-auto flex justify-between items-center">
                                    <button onClick={() => setGameState('category-menu')} className="text-gray-500 hover:text-blue-600">
                                        <i className="fas fa-arrow-left"></i> Back
                                    </button>
                                    <div className="text-lg font-bold text-blue-800">
                                        {activeReading.year} - Reading
                                    </div>
                                    <div className="w-10"></div> {/* Spacer */}
                                </div>
                            </div>

                            {/* Content */}
                            <div className="flex-1 p-4 max-w-4xl mx-auto w-full fade-in pb-24">
                                {renderReadingText()}
                            </div>

                            {/* Footer / Controls */}
                            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg z-20">
                                <div className="max-w-4xl mx-auto flex justify-between items-center">
                                    {showReadingResult ? (
                                        <div className="flex items-center gap-4 w-full justify-between">
                                            <div className="text-xl font-bold">
                                                Score: <span className={readingScore >= activeReading.answers.length / 2 ? "text-green-600" : "text-red-600"}>
                                                    {readingScore} / {activeReading.answers.length}
                                                </span>
                                            </div>
                                            <button
                                                onClick={() => handleSelectReading(selectedYear)} // Restart
                                                className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg"
                                            >
                                                <i className="fas fa-redo mr-2"></i> Try Again
                                            </button>
                                        </div>
                                    ) : (
                                        <button
                                            onClick={submitReading}
                                            className="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition transform active:scale-95"
                                        >
                                            <i className="fas fa-check-circle mr-2"></i> Submit Answers
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState === 'writing-screen' && (
                        <WritingScreen year={selectedYear} onBack={handleBackToCategory} />
                    )}

                    {gameState === 'feedback' && (
                        <FeedbackModal
                            isCorrect={lastAnswerCorrect}
                            correctAnswer={activeQuestions[currentQuestionIndex].answer}
                            explanation={activeQuestions[currentQuestionIndex].explanation}
                            question={activeQuestions[currentQuestionIndex]}
                            onNext={handleNextQuestion}
                        />
                    )}

                    {gameState === 'result' && (
                        <ResultScreen
                            score={score}
                            totalQuestions={activeQuestions.length}
                            onRestart={handleRestart}
                            onHome={handleGoHome}
                        />
                    )}

                    {/* នេះជាប៊ូតុងបិទបើក Dark Mode */}
                    <button
                        onClick={toggleDarkMode}
                        className="fixed bottom-6 right-6 z-[100] bg-gray-800 dark:bg-yellow-400 text-yellow-400 dark:text-gray-900 w-14 h-14 rounded-full shadow-2xl border-2 border-gray-700 flex items-center justify-center text-2xl transition transform hover:scale-110 hover:rotate-12"
                        title={isDarkMode ? "បិទមុខងារងងឹត" : "បើកមុខងារងងឹត"}
                    >
                        <i className={`fas ${isDarkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-yellow-400'}`}></i>
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
